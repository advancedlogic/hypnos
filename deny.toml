# cargo-deny for the three Rust workspaces (BUILD-15): backend, desktop/src-tauri, sdk/rust.
#   cargo deny --manifest-path backend/Cargo.toml --config deny.toml check
# CI runs it in ci.yml's `audit` job.

[graph]
all-features = true

[advisories]
version = 2
# Vulnerabilities always fail. Unmaintained crates fail only when a workspace crate depends on
# them directly; deeper ones (paste via image, rustls-pemfile via axum-server, ttf-parser via
# docling-pdf, zvariant via the Linux keyring) are reported and followed up with their parents.
unmaintained = "workspace"
yanked = "warn"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "NCSA",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
# espeak-rs-sys says MIT for its Rust code but builds and statically links espeak-ng, which is
# GPL-3.0-or-later: the binaries with Kokoro are distributed under the GPL v3 or later as a whole
# (README, "License"). This is the only GPL code allowed in.
[[licenses.clarify]]
crate = "espeak-rs-sys"
expression = "MIT AND GPL-3.0-or-later"
license-files = []

[[licenses.exceptions]]
crate = "espeak-rs-sys"
allow = ["GPL-3.0-or-later"]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# The vendored engine crates are path dependencies.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
