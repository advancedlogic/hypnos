[workspace]
resolver = "2"
members = [
    "crates/hypnos-core",
    "crates/hypnos-memory",
    "crates/hypnos-scheduler",
    "crates/hypnos-backends",
    "crates/hypnos-server",
]
# Vendored engine bindings keep their own workspaces (llama-cpp-rs, diffusion-rs); they are pulled in
# as path dependencies and must not be treated as members of this one.
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Hypnos Contributors"]
description = "3-Tier GPU/RAM/SSD lazy model loader and OpenAI-compatible multi-modal server"
rust-version = "1.92"

[workspace.dependencies]
tokio = { version = "1.37", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
async-trait = "0.1"
parking_lot = "0.12"
dashmap = "5.5"
bytes = "1.6"
memmap2 = "0.9"
axum = { version = "0.7", features = ["multipart", "macros"] }
tower-http = { version = "0.5", features = ["cors", "trace", "timeout", "limit", "fs"] }
futures = "0.3"
tokio-stream = "0.1"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"

# --- Native inference engines (all linked in-process, no external runtime) ---
# llama.cpp + libmtmd (Gemma 4 text/vision/audio, EmbeddingGemma 2). The vendored copy under
# `vendor/llama-cpp-rs` carries llama.cpp b11982 so the `gemma-embedding2` architecture is supported.
# Default features are off so OpenMP is only requested by the `cuda` feature of hypnos-backends:
# Apple clang ships no OpenMP runtime, and ggml falls back to its own thread pool without it.
llama-cpp-2 = { path = "vendor/llama-cpp-rs/llama-cpp-2", default-features = false, features = ["common", "mtmd"] }
# stable-diffusion.cpp (MOSS-Image). Vendored copy carries sd.cpp master-1024 with MOSS-Image support.
diffusion-rs-sys = { path = "vendor/diffusion-rs/sys" }
# ONNX Runtime (Kokoro-82M TTS) and espeak-ng (grapheme-to-phoneme), both statically built.
ort = { version = "=2.0.0-rc.15" }
espeak-rs = "0.2.0"
# docling.rs (document conversion): layout, TableFormer and OCR models on ONNX Runtime, PDFs parsed
# and rendered in pure Rust. Every docling-* crate on one version: a newer docling-pdf does not
# build against an older docling-core. docling-onnx owns the process's one ONNX Runtime environment.
docling = { version = "=2.55.4", default-features = false, features = ["pdf"] }
docling-pdf = { version = "=2.55.4", default-features = false, features = ["ml"] }
docling-onnx = { version = "=2.55.4" }
# GLiNER2.5 entity extraction on ONNX Runtime (vendored and patched, see [patch.crates-io]).
gliner25-rs = { version = "=0.5.6", default-features = false, features = ["families"] }
hound = "3.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
encoding_rs = "0.8"
ureq = { version = "2.10", default-features = false, features = ["tls"] }
rand = "0.8"

hypnos-core = { path = "crates/hypnos-core" }
hypnos-memory = { path = "crates/hypnos-memory" }
hypnos-scheduler = { path = "crates/hypnos-scheduler" }
# GPU backend chosen by hypnos-server's `cuda` (default) / `metal` features.
hypnos-backends = { path = "crates/hypnos-backends", default-features = false }

[patch.crates-io]
# Local copy of espeak-rs-sys 0.2.0 with the debug-CRT (`msvcrtd`) link directive removed; see
# vendor/espeak-rs-sys/build.rs. Everything else about the crate is unchanged.
espeak-rs-sys = { path = "vendor/espeak-rs-sys" }
# gliner25-rs 0.5.6 ported to ort rc.15 (one shared environment, `AllocationDevice<'static>`) and
# trimmed to the CPU build Hypnos links: upstream enables ort's `load-dynamic` and every GPU
# provider, which would turn the whole binary's ONNX Runtime into a dynamically loaded one.
gliner25-rs = { path = "vendor/gliner25-rs" }
# docling-onnx 2.55.4 with `PreferCPU` on every session: ort's default device policy otherwise
# registers CoreML on macOS under docling's CPU choice (4.2 GB and ~240 ms a page instead of
# 1.6 GB and ~90 ms). Execution providers docling registers itself (DOCLING_RS_EP) still win.
docling-onnx = { path = "vendor/docling-onnx" }

[profile.dev]
# Native engines are compiled in Release by their build scripts; keep Rust-side debug fast enough.
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 4
