# =============================================================================
# Hypnos — Apple Silicon (Metal) test profile with Liquid AI's LFM3 models
#
# hypnos.macos.example.toml with the Gemma 4 chat models swapped for LFM3 (llama.cpp b11960+):
#   text        lfm3:1.7b       LiquidAI/LFM3-1.7B-GGUF      Q8_0
#   vision      lfm3-vl:2b      LiquidAI/LFM3-VL-2B-GGUF     Q8_0 + BF16 vision projector
#   audio in    lfm3-audio:2b   LiquidAI/LFM3-Audio-2B-GGUF  Q8_0 + BF16 audio projector
# Everything else (embeddings, Kokoro TTS, MOSS-Image, docling, GLiNER) is unchanged.
#
#   cd backend && cargo run --release --bin hypnos -- hypnos.lfm3.macos.example.toml
#
# The LFM3 files are not in models.manifest (`./run.sh models` does not fetch them). From backend/:
#   for f in LFM3-1.7B-GGUF/LFM3-1.7B-Q8_0.gguf \
#            LFM3-VL-2B-GGUF/LFM3-VL-2B-Q8_0.gguf LFM3-VL-2B-GGUF/mmproj-LFM3-VL-2B-BF16.gguf \
#            LFM3-Audio-2B-GGUF/LFM3-Audio-2B-Q8_0.gguf LFM3-Audio-2B-GGUF/mmproj-LFM3-Audio-2B-BF16.gguf; do
#     curl -fL -C - -o "models/${f#*/}" "https://huggingface.co/LiquidAI/${f%%/*}/resolve/main/${f#*/}"
#   done
# The other models come from `./run.sh models` as usual.
#
# LFM3 is a hybrid model: 13 short-convolution layers (a recurrent state, not a KV cache), 6
# full-attention and 5 sliding-window layers. Slots resume diverging prompts from a checkpoint
# only, as with Gemma's sliding window. `"think": true` opens the chat models' <think> block (the
# thoughts are not returned); off by default. LFM3 has no tool-calling format in Hypnos: requests
# with `tools` answer 400. Layers, KV heads, head size and context are read from the GGUF; the KV
# planner books every layer as full attention, about twice what the 6 + 5 attention layers use.
#
# Everything fits in 16 GB except moss-image (9 GiB), which loads on demand.
#
#   1. lfm3:1.7b       (Text Generation)                    llama.cpp
#   2. lfm3-vl:2b      (Vision + Chat)                      llama.cpp + libmtmd
#   3. lfm3-audio:2b   (Audio / Speech-to-Text + Chat)      llama.cpp + libmtmd (audio encoder)
#   4. kokoro-82m-q4   (Text-to-Speech)                     ONNX Runtime + espeak-ng
#   5. gemmaembedding2 (Vector Embeddings)                  llama.cpp
#   6. moss-image      (Image Generation)                   stable-diffusion.cpp
#   7. docling         (Document Conversion)                docling.rs on ONNX Runtime (CPU)
#   8. gliner2.5-multi (Entity Extraction)                  gliner25-rs on ONNX Runtime (CPU)
#
# Paths are relative to the working directory (run from `backend/`).
# =============================================================================

# Schema version of this file (absent = 1). A newer Hypnos migrates older files and says so;
# `hypnos --check-config hypnos.toml` validates a file without starting the server.
config_version = 1

[server]
# Loopback by default. Before "0.0.0.0", set api_keys (or HYPNOS_API_KEYS) and [server.tls] below.
host = "127.0.0.1"
port = 9999
kv_idle_timeout_secs = 300
# CORS: exact origins or "http://localhost:*" / "http://127.0.0.1:*" wildcards. Empty = any loopback origin.
allowed_origins = []
# "pretty" for terminals, "json" (one object per line) for log shippers. Env HYPNOS_LOG_FORMAT overrides.
log_format = "pretty"
# API keys for every /v1/* route, sent as `Authorization: Bearer <key>`. Empty = no auth.
# HYPNOS_API_KEYS (comma-separated) replaces the list, so keys can stay out of this file.
# Generate one with: openssl rand -hex 32
# api_keys = ["..."]
# metrics_require_auth = false        # true: /metrics needs a key too (/health, /ready stay open)
# Labelled keys with their own limits, next to api_keys (0 or unset = no limit). The label names the
# key in the request log (GET /v1/logs?key=...), on /metrics and in rejection log lines.
# [[server.keys]]
# label = "team-a"
# key = "..."
# requests_per_minute = 60             # beyond it: HTTP 429 rate_limit_error with Retry-After
# max_concurrent = 4                   # in flight at once; a stream counts until it ends
# tokens_per_day = 2000000             # prompt + completion tokens per UTC day
# admin = false                       # true: may add, replace and remove models (POST/PUT/DELETE
#                                      # /v1/models); plain api_keys always may
# Limits for every key (plain api_keys included) that does not set its own.
# [server.api_key_defaults]
# requests_per_minute = 0
# max_concurrent = 0
# tokens_per_day = 0
# What the request log may keep at debug / trace: regular expressions whose matches in prompts,
# completions and payloads become [redacted], or ["all"] to keep no text at any level.
# request_log_redact = ["sk-[A-Za-z0-9]+", "(?i)password\\S*"]
# Built playground served at /. Unset: frontend/ beside the executable, if present (release archives).
# frontend_dir = "../frontend/dist"
# Folder the model paths below are relative to (itself relative to the working directory, i.e.
# backend/). HYPNOS_MODELS_DIR overrides it, e.g. for files on another drive. The file names
# match the `local` column of models.manifest, which `./run.sh models` downloads into it.
models_dir = "models"
# Workload profile: presets for what [[models]] blocks and [limits] leave out (priority,
# initial_tier, keep_warm_in_ram, slots, context, max_queue_per_model). Explicit keys win, so a
# block that should follow the profile leaves those keys out. `hypnos --check-config` lists what
# it set. One of: interactive_chat, voice_assistant, document_pipeline, batch_processing.
# profile = "voice_assistant"
# Pictures kept for `return_pictures` document conversions (GET /v1/documents/{id}/pictures): one
# JSON file per picture (base64 image + mime, size, page, bounding box, caption). Unset dir =
# hypnos-pictures under the OS temp directory; leftovers of an earlier run are removed at startup.
# document_pictures_dir = "pictures"
document_pictures_ttl_secs = 3600       # kept this long after the last page; DELETE /v1/documents/{id} frees earlier
document_pictures_max_bytes = 1073741824 # 1 GiB store cap, oldest documents dropped first (0 = no cap)
# HTTPS in-process (PEM files). Must stay the last part of [server]: keys below it would belong to it.
# [server.tls]
# cert_path = "certs/hypnos.crt"
# key_path = "certs/hypnos.key"

[limits]
request_timeout_secs = 900          # wall-clock budget per request (streaming: until headers are sent)
max_queue_per_model = 8             # queued + running requests per model; beyond this -> HTTP 429
max_body_bytes = 268435456          # 256 MiB HTTP body (multipart uploads included)
max_audio_bytes = 67108864          # 64 MiB per audio clip
max_image_bytes = 33554432          # 32 MiB per image (data: URL or remote download)
max_prompt_chars = 1000000          # total characters across messages / embedding inputs / TTS text
max_tokens_cap = 8192               # upper bound applied to max_tokens
max_images_per_request = 4          # cap on `n` for /v1/images/generations
allow_remote_image_urls = true      # set false to accept only data: URLs (no outbound fetches)
# Remote fetches never reach loopback, private or link-local addresses (the LAN, localhost, cloud
# metadata) unless this is true.
# allow_private_urls = false
# Busy models: "queue" (default) waits up to max_queue_per_model; "shed" refuses at once with 503
# deadline_unmeetable when the estimated wait exceeds the workload profile's objective. A request's
# own x-hypnos-deadline-ms applies either way.
# overload = "shed"

[hardware]
# Options: "auto", "nvidia_cuda", "amd_rocm", "apple_metal_uma", "vulkan"
accelerator = "apple_metal_uma"
device_id = 0
# 0 = use the Metal working set (iogpu.wired_limit_mb if raised, else Metal's recommended size)
vram_budget_bytes = 0
vram_safety_margin_bytes = 2147483648   # 2 GiB: the window server and other apps share the GPU pool
# Upper bound only: on unified memory Tier 2 is clamped to RAM - working set - 4 GiB OS reserve.
pinned_ram_budget_bytes = 34359738368
# mlock and Metal share one wired-memory limit; keep pages warm via the page cache instead.
lock_host_memory = false
# Pretend this machine has less RAM, to try out a smaller configuration: every budget is derived
# as on that machine (on a Mac including the GPU working set). 0 = the real amount.
# simulate_physical_memory_bytes = 34359738368   # e.g. a 32 GB machine
# Soft cap on what the hypnos process itself may hold (0 = none). Before each model load idle
# models are evicted, or the request fails with HTTP 507, rather than crossing it.
# max_process_memory_bytes = 21474836480         # e.g. 20 GiB
# Keep a chat model's conversations (its slots' KV state) in host memory when it is evicted, and
# restore them when it comes back, so the next turn is not prefilled from scratch (MEM-4). Off by
# default; POST /v1/memory/kv-park switches it at runtime. Up to kv_park_bytes in total, oldest
# first out. About 20 KiB per token plus ~200 MiB per conversation for the 26B (f16 KV).
# kv_park = true
# kv_park_bytes = 4294967296                     # 4 GiB (default)

# -----------------------------------------------------------------------------
# 1. LFM3 1.7B (Q8_0) — Text Generation (/v1/chat/completions)
#    LiquidAI/LFM3-1.7B-GGUF. Recommended sampling: temperature 0.1, top_k 50.
# -----------------------------------------------------------------------------
[[models]]
id = "lfm3:1.7b"
modality = "text_generation"
engine = "ggml_llama"
weights_path = "LFM3-1.7B-Q8_0.gguf"
total_weight_bytes = 1846238496         # 1.7 GiB
min_gpu_layer_ratio = 1.0               # unified memory: all layers or none
initial_tier = "tier2_pinned_ram"
keep_warm_in_ram = true
priority = "high"

[models.arch]                           # num_layers, num_kv_heads, head_dim, context: from the GGUF
default_context_len = 16384
kv_dtype = "q8_0"
non_layer_overhead_bytes = 268435456    # token embeddings
activation_workspace_bytes = 536870912

# -----------------------------------------------------------------------------
# 2. LFM3-VL 2B (Q8_0) — Vision + Chat (/v1/chat/completions with image_url)
#    LiquidAI/LFM3-VL-2B-GGUF with the BF16 vision projector
# -----------------------------------------------------------------------------
[[models]]
id = "lfm3-vl:2b"
modality = "vision"
additional_modalities = ["text_generation"]
engine = "ggml_llama"
weights_path = "LFM3-VL-2B-Q8_0.gguf"
aux_weights_path = "mmproj-LFM3-VL-2B-BF16.gguf"
total_weight_bytes = 2225234528         # 1.7 GiB weights + 0.35 GiB vision projector
min_gpu_layer_ratio = 1.0
initial_tier = "tier2_pinned_ram"
keep_warm_in_ram = true
priority = "high"

[models.arch]
default_context_len = 16384
kv_dtype = "q8_0"
non_layer_overhead_bytes = 671088640    # token embeddings + vision tower
activation_workspace_bytes = 1879048192 # measured peak minus weights and KV, + 0.25 GiB (TEST-3, docs/bench/memory-2026-11-01.md)

# -----------------------------------------------------------------------------
# 3. LFM3-Audio 2B (Q8_0) — Audio / Speech-to-Text (/v1/audio/transcriptions) + Chat
#    LiquidAI/LFM3-Audio-2B-GGUF with the BF16 audio projector. Transcription uses the model's
#    own prompt ("Perform ASR in <language>."); its speech output head is not used (Kokoro speaks).
# -----------------------------------------------------------------------------
[[models]]
id = "lfm3-audio:2b"
modality = "speech_to_text"
additional_modalities = ["text_generation"]
engine = "ggml_llama"
weights_path = "LFM3-Audio-2B-Q8_0.gguf"
aux_weights_path = "mmproj-LFM3-Audio-2B-BF16.gguf"
total_weight_bytes = 2417083104         # 1.7 GiB weights + 0.53 GiB audio projector
min_gpu_layer_ratio = 1.0
initial_tier = "tier2_pinned_ram"
keep_warm_in_ram = true
priority = "high"

[models.arch]
default_context_len = 8192
kv_dtype = "q8_0"
non_layer_overhead_bytes = 838860800    # token embeddings + audio encoder
activation_workspace_bytes = 1610612736 # measured peak minus weights and KV, + 0.25 GiB (TEST-3, docs/bench/memory-2026-11-01.md)

# -----------------------------------------------------------------------------
# 4. Kokoro 82M (fp32 ONNX) — Text-to-Speech (/v1/audio/speech)
#    onnx-community/Kokoro-82M-v1.0-ONNX; runs on CPU via ONNX Runtime (82M params, real-time+).
#    The id is kept as "kokoro-82m-q4" for API compatibility with the playground, but the fp32 graph
#    is used: the quantized model_q8f16.onnx / model_q4.onnx variants crash the statically linked
#    ONNX Runtime 1.31 CPU provider at session creation on Windows, and the fp16 graph overflows.
# -----------------------------------------------------------------------------
[[models]]
id = "kokoro-82m-q4"
modality = "text_to_speech"
engine = "onnx_runtime"
device = "cpu"                          # runs on the CPU (PreferCPU): booked in RAM, not VRAM (TEST-3)
# fp32 graph (onnx-community/Kokoro-82M-v1.0-ONNX, onnx/model.onnx). The fp16 graph overflows to an
# all-NaN waveform for some voice/text pairs on Apple Silicon (16 of 110 in a scan) and is slower.
weights_path = "kokoro/model.onnx"
voices_path = "kokoro/voices"
total_weight_bytes = 0                  # auto-detected from the file (~82 MiB)
min_gpu_layer_ratio = 1.0
initial_tier = "tier1_gpu_vram"
keep_warm_in_ram = true
priority = "realtime_pinned"

[models.arch]
num_layers = 12
num_kv_heads = 0
head_dim = 64
default_context_len = 512
max_context_len = 2048
kv_dtype = "f16"
non_layer_overhead_bytes = 15728640
activation_workspace_bytes = 67108864

# -----------------------------------------------------------------------------
# 5. EmbeddingGemma 2 (Q8_0) — Vector Embeddings (/v1/embeddings)
#    ggml-org/embeddinggemma-2-GGUF, 768-dim output, mean pooling
# -----------------------------------------------------------------------------
[[models]]
id = "gemmaembedding2"
modality = "embeddings"
engine = "ggml_llama"
weights_path = "embeddinggemma-2-Q8_0.gguf"
total_weight_bytes = 0                  # auto-detected (~296 MiB)
min_gpu_layer_ratio = 1.0
initial_tier = "tier1_gpu_vram"         # Always hot in Tier 1 VRAM
keep_warm_in_ram = true
priority = "realtime_pinned"            # Never evicted when heavy models load

[models.arch]
num_layers = 24
num_kv_heads = 2
head_dim = 512
default_context_len = 2048
max_context_len = 8192
sliding_window_len = 1024
global_attn_every_n_layers = 6
kv_dtype = "f16"
non_layer_overhead_bytes = 104857600
activation_workspace_bytes = 134217728

# -----------------------------------------------------------------------------
# 6. MOSS-Image SFT (Q4_K) — Image Generation (/v1/images/generations)
#    DiT: leejet/MOSS-Image-SFT-GGUF, text encoder: unsloth/Qwen3.5-9B-GGUF Q4_K_M,
#    VAE: Comfy-Org/MOSS-Image flux2-vae, tokenizer: OpenMOSS-Team/MOSS-Image-Base
# -----------------------------------------------------------------------------
[[models]]
id = "moss-image"
modality = "image_generation"
engine = "ggml_diffusion"
weights_path = "MOSS-Image-SFT-Q4_K.gguf"
text_encoder_path = "Qwen3.5-9B-Q4_K_M.gguf"
aux_weights_path = "flux2-vae.safetensors"
tokenizer_path = "moss_tokenizer.json"
total_weight_bytes = 9344134556         # 3.3 GiB DiT + 5.7 GiB Qwen3.5-9B + 0.3 GiB VAE
min_gpu_layer_ratio = 1.0               # unified memory: all layers or none
initial_tier = "tier3_nvme_ssd"
# No Tier 2 for the image model: sd.cpp reloads it from the OS page cache in about a second, and
# pinning its 9 GiB (DiT + text encoder + VAE) next to the chat models' 23 GiB locked a 64 GB
# machine into swapping (PERF-6). Set true only with RAM to spare.
keep_warm_in_ram = false
priority = "low"

[models.arch]
num_layers = 48
num_kv_heads = 0
head_dim = 128
default_context_len = 512
max_context_len = 1024
kv_dtype = "f16"
non_layer_overhead_bytes = 6442450944   # text encoder + VAE are not block-splittable
activation_workspace_bytes = 6174015488 # measured peak minus weights and KV, + 0.25 GiB (TEST-3, docs/bench/memory-2026-11-01.md)

# -----------------------------------------------------------------------------
# 7. docling — Document conversion (/v1/documents/convert): PDFs, images, DOCX/PPTX/XLSX, HTML
#    docling.rs (docling-project/docling.rs, MIT): layout (int8), TableFormer and PP-OCRv6 models
#    on ONNX Runtime, on the CPU; PDFs are parsed and rendered in pure Rust. weights_path is the
#    layout model, and the other model files sit in the same folder (`./run.sh models docling`).
#    Pages are converted one at a time, so this booking (models + working memory, all host RAM)
#    holds for documents of any length. OCR runs only on pages without a text layer.
#    device = "gpu" runs the models on CoreML (Metal build) or CUDA (`docling-cuda` feature) with
#    the fp32 graphs (`./run.sh models docling-gpu`) and books VRAM; give it ~5 GiB of
#    activation_workspace_bytes. On an M5 Max the CPU is faster: 15 pages in 2.5 s and 1.3 GB,
#    against 6.4 s and 5.2 GB on CoreML, which only saves CPU time for other work.
# -----------------------------------------------------------------------------
[[models]]
id = "docling"
modality = "document_conversion"
engine = "docling"
device = "cpu"                          # Tier 1 books host RAM, not VRAM
weights_path = "docling/layout_heron_int8.onnx"
total_weight_bytes = 335544320          # every docling model file (~310 MiB)
initial_tier = "tier3_nvme_ssd"
keep_warm_in_ram = false                # unloading frees the models; reloading takes ~0.3 s
priority = "normal"

[models.arch]
num_layers = 1
activation_workspace_bytes = 1610612736 # 1.5 GiB: 1.3-1.6 GB measured while converting

# -----------------------------------------------------------------------------
# 8. gliner2.5-multi — Entity extraction (/v1/entities), zero-shot: labels chosen per request
#    jugaadsrl/gliner2.5-multi-v1-onnx (Apache-2.0, multilingual), the fp32 graphs, on the CPU
#    through gliner25-rs. weights_path is the encoder; the heads, classifier and tokenizer sit in
#    the same folder. More than 8 labels run as several passes; long texts are read in windows.
# -----------------------------------------------------------------------------
[[models]]
id = "gliner2.5-multi"
modality = "entity_extraction"
engine = "gliner"
device = "cpu"                          # Tier 1 books host RAM, not VRAM
weights_path = "gliner2.5-multi/encoder_fp32.onnx"
total_weight_bytes = 1228931072         # every file in the folder (~1.15 GiB)
initial_tier = "tier3_nvme_ssd"
keep_warm_in_ram = false                # reloading takes under a second
priority = "normal"

[models.arch]
num_layers = 1
activation_workspace_bytes = 2147483648 # 3.0 GB measured after load and a 1,700-word request
