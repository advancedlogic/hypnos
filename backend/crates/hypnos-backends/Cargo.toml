[package]
name = "hypnos-backends"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"
rust-version.workspace = true

[features]
default = ["cuda"]
# GPU acceleration for llama.cpp and stable-diffusion.cpp. Disable (`--no-default-features`) for
# CPU-only builds, e.g. on CI runners without a CUDA toolkit.
cuda = ["llama-cpp-2/cuda", "llama-cpp-2/openmp", "diffusion-rs-sys/cuda"]
# Apple Silicon: `--no-default-features --features metal`. The vendored crates already turn Metal on
# for aarch64 macOS; the feature makes that explicit and keeps `cuda` (and its nvcc probe) out.
metal = ["llama-cpp-2/metal", "diffusion-rs-sys/metal", "docling-pdf/coreml"]
# docling's `device = "gpu"` on NVIDIA: ONNX Runtime's CUDA provider. Opt-in and not part of the
# release builds: the prebuilt ONNX Runtime GPU build is CUDA 13 only (driver 580+, cuDNN 9 for
# CUDA 13, provider libraries beside the binary), while the llama.cpp / sd.cpp engines target
# CUDA 12.8. Turning it on switches every ONNX engine (Kokoro, GLiNER) to that ONNX Runtime.
docling-cuda = ["docling-pdf/cuda"]

[dependencies]
hypnos-core.workspace = true
tokio.workspace = true
async-trait.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
base64.workspace = true

# Native engines (in-process)
llama-cpp-2.workspace = true
diffusion-rs-sys.workspace = true
ort.workspace = true
espeak-rs.workspace = true
docling.workspace = true
docling-pdf.workspace = true
docling-onnx.workspace = true
gliner25-rs.workspace = true

# Media / codec helpers
hound.workspace = true
image.workspace = true
encoding_rs.workspace = true
ureq.workspace = true
rand.workspace = true

[build-dependencies]
glob = "0.3"
