[package]
name = "hypnos-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "hypnos"
path = "src/main.rs"

[features]
default = ["cuda"]
# Forwarded to hypnos-backends so `-p hypnos-server --no-default-features --features metal` selects
# the GPU backend without reaching into the dependency's features.
cuda = ["hypnos-backends/cuda"]
metal = ["hypnos-backends/metal"]
# docling on the GPU through ONNX Runtime's CUDA provider (opt-in, see hypnos-backends).
docling-cuda = ["hypnos-backends/docling-cuda"]

[dependencies]
hypnos-core.workspace = true
hypnos-memory.workspace = true
hypnos-scheduler.workspace = true
hypnos-backends.workspace = true
tokio.workspace = true
parking_lot.workspace = true
axum.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
futures.workspace = true
tokio-stream.workspace = true
bytes.workspace = true
chrono.workspace = true
uuid.workspace = true
anyhow.workspace = true
base64.workspace = true
# HTTPS and API keys (API-1). rustls with the ring provider, which ureq already brings in.
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
ring = "0.17"
subtle = "2.6"


[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
