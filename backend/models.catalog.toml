# Text, vision, audio in
# -----------------------------------------------------------------------------------------------

[[models]]
id = "gemma4:26b-q4"
name = "Gemma 4 26B-A4B"
publisher = "Google"
license = "gemma"
architecture = "gemma4"
modality = "text_generation"
additional_modalities = ["vision"]
engine = "ggml_llama"
capabilities = ["thinking", "tools"]
summary = "Mixture-of-Experts chat and vision model (4B active parameters): the strongest answers in the lineup, with tool calling and thinking."
lineup = true

[models.config]
min_gpu_layer_ratio = 0.25
initial_tier = "tier2_pinned_ram"
keep_warm_in_ram = true
priority = "high"
slots = 3

[models.config.arch]
default_context_len = 16384
kv_dtype = "f16"
