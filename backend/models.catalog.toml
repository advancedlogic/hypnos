# Hypnos model catalog (API-10): models Hypnos has been tested with, their quantization
# variants, the files each needs and the [[models]] block that runs it.
#
# Curated on purpose: a GGUF that loads is not yet a model that works (prompt format, media
# markers, thinking, memory handling). A ggml_llama entry must use an architecture listed in
# hypnos-core/src/catalog.rs (TESTED_GGUF_ARCHITECTURES); downloaded weights whose GGUF reports
# another one are refused. `lineup = true` marks the default lineup of models.manifest (a test
# keeps the default variants and the manifest in step).
#
# Entry: id, name, publisher, license, architecture (GGUF general.architecture for ggml_llama),
# modality, additional_modalities, engine, capabilities (thinking, tools), summary, lineup,
# [models.config] (further [[models]] keys; [models.config.arch] = [models.arch]) and one
# [[models.variants]] per quantization: quant, default (exactly one), note, files.
# [models.estimate] holds the [models.arch] values the server reads from the GGUF (layers, KV heads,
# head size, context, sliding window, expert bytes), so a model can be sized without its files
# (the advisor, POST /v1/advisor); it is never written into a config block.
# File: role (weights | aux | text_encoder | tokenizer | voices | data), repo (Hugging Face
# repository or an https:// base URL), remote (path in the repo, `/` = folder), local (path under
# models_dir), entry (for a folder: the file the config path names), size (bytes), platform
# (all | macos-arm64 | other). The block's paths, modalities, engine and total_weight_bytes come
# from the entry and the chosen variant.
#
# The server serves it as GET /v1/models/catalog; `hypnos --catalog-block <id>[:<quant>]` prints a
# block, and `./run.sh models <id>[:<quant>]` downloads a variant.

catalog_version = 1

