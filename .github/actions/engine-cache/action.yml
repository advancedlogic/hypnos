name: Prebuilt engines
description: >
  Builds llama.cpp and stable-diffusion.cpp once per engine version and reuses them in every later
  run (BUILD-13). The builds are kept as assets of the `engines` prerelease of this repository:
  permanent, shared by every branch and tag, outside the Actions cache (10 GB, evicted after a
  week unused). `restore` (before cargo) sets HYPNOS_ENGINE_KEY and downloads the build for that
  key into HYPNOS_ENGINE_DIR; the vendored build scripts copy it into their OUT_DIR and skip CMake
  when its stamp carries the key. `save` (after a successful build) uploads the build when none
  was found, without the object files and the source copy. The key hashes everything that shapes
  the engines: the vendor pins and patches, this action, the CMake / CUDA / ggml settings in the
  environment, the profile and `salt` (the platform and features). Any change builds them again
  (once); `rebuild: true` does it on demand.
inputs:
  mode:
    description: restore or save
    required: true
  profile:
    description: the cargo profile directory (release or debug)
    default: release
  salt:
    description: what else shapes the build (platform, cargo features)
    default: ""
  rebuild:
    description: "true: do not download the engines, build them again (the new build is uploaded)"
    default: "false"
runs:
  using: composite
  steps:
    - name: Engine build key
      if: inputs.mode == 'restore'
      shell: bash
      run: |
        files=(backend/scripts/vendor.sh .github/actions/engine-cache/action.yml)
        files+=($(ls backend/vendor/patches/*.patch))
        # The environment the engines' CMake builds read (not the compiler cache launchers,
        # which do not change what is built).
        settings=$(env | grep -E '^(CMAKE_|CUDA|GGML_|LLAMA_|CC=|CXX=|CFLAGS=|CXXFLAGS=|MACOSX_DEPLOYMENT_TARGET=)' \
          | grep -v '_COMPILER_LAUNCHER=' | sort)
        sum=$( { cat "${files[@]}"; echo "${{ inputs.salt }}"; echo "$settings"; } | sha256sum | cut -c1-16)
        # Readable part first, so an older build of the same platform can be found and replaced.
        slug=$(echo "${RUNNER_OS}-${{ inputs.profile }}-${{ inputs.salt }}" | tr 'A-Z' 'a-z' \
          | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g')
        echo "ENGINE_PREFIX=engines-$slug-" >> "$GITHUB_ENV"
        echo "ENGINE_ASSET=engines-$slug-$sum.tar.gz" >> "$GITHUB_ENV"
        echo "HYPNOS_ENGINE_KEY=$slug-$sum" >> "$GITHUB_ENV"
        echo "HYPNOS_ENGINE_DIR=$RUNNER_TEMP/hypnos-engines" >> "$GITHUB_ENV"
        echo "engine build key: $slug-$sum"
    - name: Download the prebuilt engines
      if: inputs.mode == 'restore'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir -p "$HYPNOS_ENGINE_DIR"
        if [ "${{ inputs.rebuild }}" = "true" ]; then
          echo "rebuild requested: CMake builds the engines"
        elif gh release download engines -R "$GITHUB_REPOSITORY" -p "$ENGINE_ASSET" -D "$RUNNER_TEMP" --clobber 2>/dev/null; then
          # Relative paths: GNU tar on Windows reads `D:\...` as a remote host.
          (cd "$RUNNER_TEMP" && tar -xzf "$ENGINE_ASSET" -C hypnos-engines && rm "$ENGINE_ASSET")
          echo "ENGINE_PREBUILT=1" >> "$GITHUB_ENV"
          echo "reusing the prebuilt engines $ENGINE_ASSET:"
          du -sh "$HYPNOS_ENGINE_DIR"/*
        else
          echo "no prebuilt engines for this key ($ENGINE_ASSET): CMake builds them, this run uploads them"
        fi
    # Pull requests only read (a fork's token cannot write, and a branch is not reviewed yet).
    - name: Upload the engine builds
      if: inputs.mode == 'save' && env.ENGINE_PREBUILT != '1' && github.event_name != 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        stage="$RUNNER_TEMP/hypnos-engines-new"
        rm -rf "$stage"; mkdir -p "$stage"
        for crate in llama-cpp-sys-2 diffusion-rs-sys; do
          # The OUT_DIR this build stamped with the key (cargo's hash in the folder name varies).
          d=""
          for out in backend/target/${{ inputs.profile }}/build/$crate-*/out; do
            [ -f "$out/hypnos-engine.key" ] && [ "$(cat "$out/hypnos-engine.key")" = "$HYPNOS_ENGINE_KEY" ] && d="$out"
          done
          [ -n "$d" ] || { echo "::warning::no $crate build stamped $HYPNOS_ENGINE_KEY, nothing uploaded"; exit 0; }
          cp -R "$d" "$stage/$crate"
          find "$stage/$crate" -type f \( -name '*.o' -o -name '*.obj' \) -delete
          find "$stage/$crate" -type d -name CMakeFiles -prune -exec rm -rf {} +
          # diffusion-rs copies the sd.cpp sources here when they are missing: not worth keeping.
          rm -rf "$stage/$crate/stable-diffusion.cpp"
          du -sh "$stage/$crate"
        done
        (cd "$stage" && tar -czf "../$ENGINE_ASSET" .)
        ls -l "$RUNNER_TEMP/$ENGINE_ASSET"
        repo="$GITHUB_REPOSITORY"
        gh release view engines -R "$repo" >/dev/null 2>&1 || gh release create engines -R "$repo" \
          --prerelease --latest=false --target "$GITHUB_SHA" --title "Engine builds (CI)" \
          --notes "Prebuilt llama.cpp and stable-diffusion.cpp for CI and the release builds (BUILD-13, .github/actions/engine-cache). Not a release: nothing here is meant to be downloaded by hand." \
          || true
        if gh release upload engines -R "$repo" "$RUNNER_TEMP/$ENGINE_ASSET" --clobber; then
          echo "uploaded $ENGINE_ASSET"
          # Drop this platform's builds for older keys.
          gh release view engines -R "$repo" --json assets --jq '.assets[].name' \
            | grep -E "^${ENGINE_PREFIX}[0-9a-f]{16}\.tar\.gz$" | grep -vxF "$ENGINE_ASSET" \
            | while read -r old; do gh release delete-asset engines "$old" -R "$repo" -y && echo "removed $old"; done || true
        else
          echo "::warning::could not upload the engine builds (token without contents: write?)"
        fi
