name: Feature or change
description: A new capability, model, route or improvement
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change; acceptance criteria if you have them.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Server API
        - Engines / models
        - Memory, scheduling
        - Performance
        - Desktop app
        - Playground
        - Build, CI, packaging
        - Documentation
        - Tests
