name: build-server

# The server archives, one per platform in `platforms` (a JSON list of {platform, os, cargo}).
# release.yml calls it twice, CUDA and macOS, so the macOS app (which bundles the Metal server,
# DESK-16) does not wait for the CUDA builds. Expects the `frontend-dist` artifact of the same
# run; uploads `hypnos-<platform>`. The macOS leg signs and notarizes with the APPLE_* secrets
# (secrets: inherit).
on:
  workflow_call:
    inputs:
      platforms:
        type: string
        required: true
      rebuild_engines:
        description: build llama.cpp and stable-diffusion.cpp again instead of reusing the cached builds
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CMAKE_GENERATOR: Ninja
  LLAMA_LIB_PROFILE: Release
  CUDA_VERSION: "12.8.1"
  # The GPUs the CUDA archives support (BUILD-11): device code for RTX 30 (8.6), RTX 40 (8.9) and
  # RTX 50 (12.0a, FP4 tensor cores), PTX for Turing (7.5) and Ampere (8.0, which A100, H100 and
  # newer JIT from on first load). ggml's portable default adds Maxwell, Pascal, Volta and Hopper
  # PTX: 9 compilations of every CUDA kernel instead of 5, the bulk of a 2-3 hour build.
  # Forwarded to both ggml builds (llama-cpp-sys passes CMAKE_* through, the diffusion-rs patch
  # this variable); the Dockerfile uses the same list.
  CUDA_ARCHITECTURES: "75-virtual;80-virtual;86-real;89-real;120a-real"

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platforms) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: lukka/get-cmake@f86dd60acae0d132056913e248bdabf0e0580b7a # v4.4.5

      # sccache for the engines' C, C++ and CUDA objects (CMake reads the *_COMPILER_LAUNCHER
      # variables from the environment), stored in the GitHub Actions cache. A tag run reads the
      # caches of its own tag and of main, so a manual run of release on main fills it for the
      # next tag. A cache error falls back to compiling. vars.HYPNOS_SCCACHE = "off" disables it.
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        if: vars.HYPNOS_SCCACHE != 'off'
      - name: Compiler cache
        if: vars.HYPNOS_SCCACHE != 'off'
        shell: bash
        run: |
          {
            echo "SCCACHE_GHA_ENABLED=true"
            echo "SCCACHE_IGNORE_SERVER_IO_ERROR=1"
            echo "CMAKE_C_COMPILER_LAUNCHER=sccache"
            echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache"
          } >> "$GITHUB_ENV"
          # nvcc through sccache on Linux and Windows (BUILD-12: without it Windows recompiled
          # every CUDA kernel, 2h43m against Linux's 39 min). CMake's compiler checks build in
          # Debug, which on Windows adds MSVC's shared-PDB flags that sccache refuses for nvcc:
          # they build in Release instead (llama-cpp-sys forwards every CMAKE_* variable, the
          # diffusion-rs patch this one). macOS builds no CUDA.
          if [ "$RUNNER_OS" != macOS ]; then
            echo "CMAKE_CUDA_COMPILER_LAUNCHER=sccache" >> "$GITHUB_ENV"
            echo "CMAKE_TRY_COMPILE_CONFIGURATION=Release" >> "$GITHUB_ENV"
          fi

      - name: CUDA architectures
        if: runner.os != 'macOS'
        shell: bash
        run: echo "CMAKE_CUDA_ARCHITECTURES=$CUDA_ARCHITECTURES" >> "$GITHUB_ENV"

      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: CUDA toolkit (Linux, NVIDIA apt repository)
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: |
          v="${CUDA_VERSION%.*}"; v="${v/./-}"
          curl -fsSLO https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev libclang-dev \
            "cuda-nvcc-$v" "cuda-cudart-dev-$v" "cuda-cccl-$v" "cuda-driver-dev-$v" "libcublas-dev-$v"
          cuda="/usr/local/cuda-${CUDA_VERSION%.*}"
          [ -e /usr/local/cuda ] || sudo ln -s "$cuda" /usr/local/cuda
          echo "$cuda/bin" >> "$GITHUB_PATH"
          echo "CUDA_PATH=$cuda" >> "$GITHUB_ENV"

      - name: CUDA toolkit (Windows)
        if: runner.os == 'Windows'
        uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d # v0.2.36
        with:
          cuda: ${{ env.CUDA_VERSION }}
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "thrust", "visual_studio_integration"]'

      - name: MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: macOS deployment target
        if: runner.os == 'macOS'
        run: echo "MACOSX_DEPLOYMENT_TARGET=14.0" >> "$GITHUB_ENV"

      - name: Vendor engine sources (pinned commits + patches)
        shell: bash
        run: ./backend/scripts/vendor.sh

      # pwsh, not bash: Git Bash puts its own /usr/bin/link.exe ahead of MSVC's on Windows.
      # BUILD-13: reuse the previous CMake builds of the engines when nothing that shapes them
      # changed (pins, patches, CMake / CUDA settings, rustc, features), so a Rust-only change
      # does not recompile llama.cpp and sd.cpp. A manual run of release can force a rebuild.
      - name: Engine builds (restore)
        uses: ./.github/actions/engine-cache
        with:
          mode: restore
          salt: ${{ matrix.platform }} ${{ matrix.cargo }}
          rebuild: ${{ inputs.rebuild_engines }}

      - name: Build
        working-directory: backend
        shell: pwsh
        run: cargo build --release -p hypnos-server ${{ matrix.cargo }}

      - name: Compiler cache statistics
        if: always() && vars.HYPNOS_SCCACHE != 'off'
        shell: bash
        run: sccache --show-stats || true

      # Developer ID signature + notarization of hypnos and libstable-diffusion.dylib with the
      # desktop job's Apple secrets (docs/signing.md, section 3). Without APPLE_CERTIFICATE the
      # binaries keep the linker's ad-hoc signature; without APPLE_ID they are signed only.
      - name: Sign and notarize (macOS)
        id: macsign
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "No APPLE_CERTIFICATE / APPLE_SIGNING_IDENTITY secret: ad-hoc signature."; exit 0
          fi
          kc="$RUNNER_TEMP/signing.keychain-db"; kcpw="$(uuidgen)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$kc"
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          # Notarization: the App Store Connect API key when its secrets exist, else the Apple ID.
          notarize=()
          if [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_API_KEY_P8" ]; then
            export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
            printf '%s\n' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY_PATH"
            unset APPLE_ID APPLE_PASSWORD
            notarize=(--notarize)
          elif [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            notarize=(--notarize)
          fi
          [ ${#notarize[@]} -gt 0 ] && echo "notarized=1" >> "$GITHUB_OUTPUT"
          SIGN_KEYCHAIN="$kc" ./backend/scripts/sign-macos.sh ${notarize[@]+"${notarize[@]}"}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Package
        shell: bash
        env:
          MACOS_NOTARIZED: ${{ steps.macsign.outputs.notarized }}
        run: |
          version="${GITHUB_REF_NAME}"
          [[ "$GITHUB_REF" == refs/tags/* ]] || version="$(git describe --tags --always)"
          ./backend/scripts/package-release.sh ${{ matrix.platform }} --version "$version" --out dist

      # cudart / cuBLAS are redistributable; shipped separately like llama.cpp's cudart archive,
      # so the main download stays small for machines with the CUDA toolkit installed.
      - name: CUDA runtime DLLs (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME}"
          [[ "$GITHUB_REF" == refs/tags/* ]] || version="$(git describe --tags --always)"
          bin="$(cygpath -u "$CUDA_PATH")/bin"
          mkdir -p dist/cudart
          cp "$bin"/cudart64_12.dll "$bin"/cublas64_12.dll "$bin"/cublasLt64_12.dll dist/cudart/
          (cd dist/cudart && 7z a -tzip -mx=7 "../hypnos-$version-windows-x64-cuda12-runtime.zip" ./*.dll >/dev/null)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hypnos-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

      # After the archive is uploaded (pruning removes the object files the package does not need).
      - name: Engine builds (save)
        uses: ./.github/actions/engine-cache
        with:
          mode: save
