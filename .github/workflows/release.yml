name: release

# A pushed tag `v*` builds every archive and publishes a GitHub release with them. Running the
# workflow by hand builds the same archives as workflow artifacts and publishes nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      rebuild_engines:
        description: Rebuild llama.cpp and stable-diffusion.cpp (they are reused from the last build while their pins, patches and settings are unchanged)
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The build env (CMake generator, CUDA version) lives in build-server.yml.

jobs:
  # fmt, clippy, the CPU and Metal builds and the tests (ci.yml), alongside the archive builds:
  # the image push and the release wait for it, so a tag that fails them publishes nothing.
  ci:
    uses: ./.github/workflows/ci.yml
    # A called workflow gets at most its caller's permissions: the build jobs upload the engine
    # builds (BUILD-13).
    permissions:
      contents: write

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci && npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: frontend/dist

  # The server archives (build-server.yml). CUDA and macOS are separate calls so the desktop job,
  # whose macOS app bundles the Metal server (DESK-16), only waits for the macOS one.
  # ubuntu-24.04 sets the glibc floor of the Linux binary (2.39); ort's prebuilt static ONNX
  # Runtime needs glibc 2.38+ and GCC 14's libstdc++, so 22.04 cannot link. -j 2 caps nvcc at about
  # four processes (cargo -j is also each engine's CMake --parallel); more runs out of the
  # runners' 16 GB on the CUTLASS kernels.
  # docling-cuda: ONNX Runtime's CUDA provider for docling's device = "gpu" (prebuilt by ort,
  # no CUDA 13 toolkit needed to build; the provider library ships in the archive and is
  # loaded only for that device, which then needs the CUDA 13 runtime and cuDNN 9).
  # Linux and Windows are separate calls so the Docker image, which packs the Linux archive,
  # does not wait for the (slower) Windows build.
  build-linux:
    needs: frontend
    uses: ./.github/workflows/build-server.yml
    permissions:
      contents: write
    secrets: inherit
    with:
      rebuild_engines: ${{ inputs.rebuild_engines == true }}
      platforms: >-
        [{"platform": "linux-x64-cuda", "os": "ubuntu-24.04", "cargo": "-j 2 --features docling-cuda"}]

  build-windows:
    needs: frontend
    uses: ./.github/workflows/build-server.yml
    permissions:
      contents: write
    secrets: inherit
    with:
      rebuild_engines: ${{ inputs.rebuild_engines == true }}
      platforms: >-
        [{"platform": "windows-x64-cuda", "os": "windows-2022", "cargo": "-j 2 --features docling-cuda"}]

  build-macos:
    needs: frontend
    uses: ./.github/workflows/build-server.yml
    permissions:
      contents: write
    secrets: inherit
    with:
      rebuild_engines: ${{ inputs.rebuild_engines == true }}
      platforms: >-
        [{"platform": "macos-arm64-metal", "os": "macos-15", "cargo": "--no-default-features --features metal"}]

  # The desktop app's installers. Signing turns on with the repository secrets (BUILD-9):
  #   macOS:   APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY
  #            ("Developer ID Application: Name (TEAMID)"); notarization also needs APPLE_ID,
  #            APPLE_PASSWORD (an app-specific password) and APPLE_TEAM_ID.
  #   Windows: WINDOWS_CERTIFICATE (base64 .pfx) and WINDOWS_CERTIFICATE_PASSWORD.
  # Without them macOS gets an ad-hoc signature (Gatekeeper offers "Open Anyway" instead of
  # calling the app damaged) and Windows none (SmartScreen: "More info > Run anyway").
  # The macOS app carries the Metal server from the macos-arm64-metal archive (DESK-16), hence
  # `needs: build-macos`; `!cancelled()` keeps a failed macOS server build from skipping the
  # Linux and Windows installers (the macOS one then fails at its download step).
  desktop:
    name: desktop ${{ matrix.platform }}
    needs: build-macos
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 keeps the glibc floor of the .deb and the AppImage low (2.35).
          - { platform: linux-x64, os: ubuntu-22.04, bundles: "deb,appimage" }
          - { platform: windows-x64, os: windows-2022, bundles: "msi,nsis" }
          - { platform: macos-arm64, os: macos-15, bundles: "dmg" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Linux webview deps
        timeout-minutes: 10
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 libasound2-dev
      - name: macOS deployment target
        if: runner.os == 'macOS'
        run: echo "MACOSX_DEPLOYMENT_TARGET=14.0" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      # Imports the code-signing certificate into the runner's store and passes its thumbprint
      # to Tauri, which signs the .exe, the .msi and the NSIS installer with signtool.
      - name: Windows signing certificate
        id: wincert
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) { Write-Host "No WINDOWS_CERTIFICATE secret: unsigned build."; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT
      - name: Server for the app bundle (macOS)
        if: runner.os == 'macOS'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hypnos-macos-arm64-metal
          path: dist-server
      - name: Stage the server (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: ./desktop/scripts/stage-server.sh --archive dist-server/hypnos-*-macos-arm64-metal.tar.gz
      - name: Build the installers
        working-directory: desktop
        shell: bash
        env:
          # Read by the Tauri CLI; empty secrets leave the unsigned / ad-hoc path untouched.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          WINDOWS_THUMBPRINT: ${{ steps.wincert.outputs.thumbprint }}
        run: |
          npm ci
          # Notarization with the App Store Connect API key when its secrets exist (Tauri reads
          # APPLE_API_KEY, APPLE_API_ISSUER and the .p8 at APPLE_API_KEY_PATH), else the Apple ID.
          if [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_API_KEY_P8" ]; then
            export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
            printf '%s\n' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY_PATH"
            unset APPLE_ID APPLE_PASSWORD
          else
            unset APPLE_API_KEY APPLE_API_ISSUER
          fi
          unset APPLE_API_KEY_P8
          # Tauri treats a set-but-empty variable as configured: drop the ones without a secret.
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v:-}" ] || unset "$v"
          done
          # The tag's version goes into the installers; a manual run keeps tauri.conf.json's.
          config='{}'
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            config=$(jq -c --arg v "${GITHUB_REF_NAME#v}" '.version = $v' <<<"$config")
          fi
          if [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
            # A Developer ID signature gets the hardened runtime (notarization needs it); the
            # ad-hoc default has none, whose library validation would refuse the bundled dylib.
            config=$(jq -c --arg id "$APPLE_SIGNING_IDENTITY" '.bundle.macOS.signingIdentity = $id | .bundle.macOS.hardenedRuntime = true' <<<"$config")
          fi
          if [ -n "$WINDOWS_THUMBPRINT" ]; then
            config=$(jq -c --arg t "$WINDOWS_THUMBPRINT" \
              '.bundle.windows.certificateThumbprint = $t | .bundle.windows.digestAlgorithm = "sha256" | .bundle.windows.timestampUrl = "http://timestamp.digicert.com"' <<<"$config")
          fi
          echo "tauri config overrides: $(jq -c 'if .bundle.windows then .bundle.windows.certificateThumbprint = "***" else . end' <<<"$config")"
          server=()
          [ "$RUNNER_OS" = macOS ] && server=(--config src-tauri/tauri.server-macos.conf.json)
          npx tauri build --bundles ${{ matrix.bundles }} ${server[@]+"${server[@]}"} --config "$config"
      # Tauri notarizes and staples the app inside the .dmg, not the .dmg: a downloaded, quarantined
      # image would assess as "Unnotarized Developer ID". Notarize and staple the image as well.
      - name: Notarize the disk image (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_API_KEY_P8" ]; then
            key="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
            printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
            creds=(--key "$key" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER")
          elif [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            creds=(--apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID")
          else
            echo "No notarization secrets: the disk image stays unnotarized."; exit 0
          fi
          for dmg in desktop/src-tauri/target/release/bundle/dmg/*.dmg; do
            xcrun notarytool submit "$dmg" "${creds[@]}" --wait --timeout 30m
            # Apple's ticket service drops connections now and then (error 68): retry the staple.
            for attempt in 1 2 3; do
              xcrun stapler staple "$dmg" && break
              [ "$attempt" = 3 ] && exit 1
              echo "staple failed, retrying in 30 s"; sleep 30
            done
            spctl -a -vv -t open --context context:primary-signature "$dmg"
          done
      - name: Collect
        shell: bash
        run: |
          version="${GITHUB_REF_NAME}"
          [[ "$GITHUB_REF" == refs/tags/* ]] || version="$(git describe --tags --always)"
          mkdir -p dist
          bundle=desktop/src-tauri/target/release/bundle
          for f in "$bundle"/dmg/*.dmg "$bundle"/msi/*.msi "$bundle"/nsis/*.exe "$bundle"/deb/*.deb "$bundle"/appimage/*.AppImage; do
            [ -f "$f" ] || continue
            ext="${f##*.}"
            [ "$ext" = exe ] && ext="setup.exe"
            cp "$f" "dist/hypnos-desktop-$version-${{ matrix.platform }}.$ext"
          done
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hypnos-desktop-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  docker:
    name: docker (CUDA, GHCR)
    # Builds and pushes in one step, so the whole job waits for the checks. The image packs the
    # linux-x64-cuda archive (Dockerfile SERVER=archive) instead of compiling the engines again.
    needs: [ci, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hypnos-linux-x64-cuda
          path: prebuilt
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=sha
      # A manual run builds the image without pushing it.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            SERVER=archive

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ci, build-linux, build-windows, build-macos, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: hypnos-*
          merge-multiple: true
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          MAC_SIGNED: ${{ secrets.APPLE_CERTIFICATE != '' && (secrets.APPLE_API_KEY != '' || secrets.APPLE_ID != '') }}
          WIN_SIGNED: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
        run: |
          cd dist
          mac="The macOS app and server are not notarized: open the app once with System Settings > Privacy & Security > Open Anyway, and run xattr -dr com.apple.quarantine . in the server folder."
          win="The Windows installers are not signed: choose More info > Run anyway."
          [ "$MAC_SIGNED" = true ] && mac="The macOS app and server are signed and notarized."
          [ "$WIN_SIGNED" = true ] && win="The Windows installers are signed."
          SIGNING_NOTE="$mac $win"
          files=(*.tar.gz *.zip hypnos-desktop-*)
          sha256sum -- "${files[@]}" > SHA256SUMS
          cat > notes.md <<EOF
          Prebuilt archives for ${GITHUB_REF_NAME}. Unpack, then follow \`README.txt\` inside
          (download models with \`scripts/fetch-models\`, run \`hypnos\`, open http://127.0.0.1:9999).

          | Archive | Needs |
          | :--- | :--- |
          | \`linux-x64-cuda\` | glibc 2.39+, an NVIDIA GPU from Turing on (RTX 20+), driver 570+, CUDA 12 runtime (cudart, cuBLAS), libgomp1 |
          | \`windows-x64-cuda\` | an NVIDIA GPU from Turing on (RTX 20+), driver 570+, plus \`windows-x64-cuda12-runtime.zip\` unpacked beside \`hypnos.exe\` (or the CUDA Toolkit 12.x) |
          | \`macos-arm64-metal\` | Apple Silicon, macOS 14+ |

          Desktop app (a chat client with live server stats; it connects to a running Hypnos):
          \`hypnos-desktop-*-macos-arm64.dmg\`, \`-windows-x64.msi\` / \`.setup.exe\`,
          \`-linux-x64.deb\` / \`.AppImage\`. ${SIGNING_NOTE}

          Document conversion on the GPU (docling with \`device = "gpu"\`, off by default) additionally
          needs driver 580+, the CUDA 13 runtime and cuDNN 9 for CUDA 13; see \`README.txt\` in the archive.

          Docker (CUDA): \`docker pull ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME#v}\`

          The binaries link espeak-ng statically, so each archive is distributed under the GNU GPL
          v3 or later (text included); Hypnos's own code is MIT OR Apache-2.0. Corresponding source:
          https://github.com/${GITHUB_REPOSITORY}/tree/${GITHUB_REF_NAME}
          EOF
          # A release made in the GitHub UI (which creates the tag) or left as a draft when its tag
          # moved gets the archives attached and is published; otherwise one is created.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
              -- "${files[@]}" SHA256SUMS
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false \
              --title "Hypnos $GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "Hypnos $GITHUB_REF_NAME" --notes-file notes.md \
              -- "${files[@]}" SHA256SUMS
          fi
