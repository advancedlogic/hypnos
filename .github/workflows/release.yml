name: release

# A pushed tag `v*` builds every archive and publishes a GitHub release with them. Running the
# workflow by hand builds the same archives as workflow artifacts and publishes nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CMAKE_GENERATOR: Ninja
  LLAMA_LIB_PROFILE: Release
  # CUDA builds leave CMAKE_CUDA_ARCHITECTURES to ggml's portable default for this toolkit
  # (PTX for Maxwell..Hopper plus Ampere, Ada and Blackwell device code), like llama.cpp releases.
  CUDA_VERSION: "12.8.1"

jobs:
  # fmt, clippy, the CPU and Metal builds and the tests (ci.yml), alongside the archive builds:
  # the image push and the release wait for it, so a tag that fails them publishes nothing.
  ci:
    uses: ./.github/workflows/ci.yml

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  build:
    name: ${{ matrix.platform }}
    needs: frontend
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-24.04 sets the glibc floor of the Linux binary (2.39); ort's prebuilt static ONNX
          # Runtime needs glibc 2.38+ and GCC 14's libstdc++, so 22.04 cannot link. -j 2 caps nvcc at about
          # four processes (cargo -j is also each engine's CMake --parallel); more runs out of the
          # runners' 16 GB on the CUTLASS kernels.
          # docling-cuda: ONNX Runtime's CUDA provider for docling's device = "gpu" (prebuilt by ort,
          # no CUDA 13 toolkit needed to build; the provider library ships in the archive and is
          # loaded only for that device, which then needs the CUDA 13 runtime and cuDNN 9).
          - { platform: linux-x64-cuda, os: ubuntu-24.04, cargo: "-j 2 --features docling-cuda" }
          - { platform: windows-x64-cuda, os: windows-2022, cargo: "-j 2 --features docling-cuda" }
          - { platform: macos-arm64-metal, os: macos-15, cargo: "--no-default-features --features metal" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: lukka/get-cmake@latest

      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: CUDA toolkit (Linux, NVIDIA apt repository)
        if: runner.os == 'Linux'
        run: |
          v="${CUDA_VERSION%.*}"; v="${v/./-}"
          curl -fsSLO https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev libclang-dev \
            "cuda-nvcc-$v" "cuda-cudart-dev-$v" "cuda-cccl-$v" "cuda-driver-dev-$v" "libcublas-dev-$v"
          cuda="/usr/local/cuda-${CUDA_VERSION%.*}"
          [ -e /usr/local/cuda ] || sudo ln -s "$cuda" /usr/local/cuda
          echo "$cuda/bin" >> "$GITHUB_PATH"
          echo "CUDA_PATH=$cuda" >> "$GITHUB_ENV"

      - name: CUDA toolkit (Windows)
        if: runner.os == 'Windows'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: ${{ env.CUDA_VERSION }}
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "thrust", "visual_studio_integration"]'

      - name: MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: macOS deployment target
        if: runner.os == 'macOS'
        run: echo "MACOSX_DEPLOYMENT_TARGET=14.0" >> "$GITHUB_ENV"

      - name: Vendor engine sources (pinned commits + patches)
        shell: bash
        run: ./backend/scripts/vendor.sh

      # pwsh, not bash: Git Bash puts its own /usr/bin/link.exe ahead of MSVC's on Windows.
      - name: Build
        working-directory: backend
        shell: pwsh
        run: cargo build --release -p hypnos-server ${{ matrix.cargo }}

      # Developer ID signature + notarization of hypnos and libstable-diffusion.dylib with the
      # desktop job's Apple secrets (docs/signing.md, section 3). Without APPLE_CERTIFICATE the
      # binaries keep the linker's ad-hoc signature; without APPLE_ID they are signed only.
      - name: Sign and notarize (macOS)
        id: macsign
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "No APPLE_CERTIFICATE / APPLE_SIGNING_IDENTITY secret: ad-hoc signature."; exit 0
          fi
          kc="$RUNNER_TEMP/signing.keychain-db"; kcpw="$(uuidgen)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$kc"
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          notarize=()
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            notarize=(--notarize)
            echo "notarized=1" >> "$GITHUB_OUTPUT"
          fi
          SIGN_KEYCHAIN="$kc" ./backend/scripts/sign-macos.sh ${notarize[@]+"${notarize[@]}"}

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Package
        shell: bash
        env:
          MACOS_NOTARIZED: ${{ steps.macsign.outputs.notarized }}
        run: |
          version="${GITHUB_REF_NAME}"
          [[ "$GITHUB_REF" == refs/tags/* ]] || version="$(git describe --tags --always)"
          ./backend/scripts/package-release.sh ${{ matrix.platform }} --version "$version" --out dist

      # cudart / cuBLAS are redistributable; shipped separately like llama.cpp's cudart archive,
      # so the main download stays small for machines with the CUDA toolkit installed.
      - name: CUDA runtime DLLs (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME}"
          [[ "$GITHUB_REF" == refs/tags/* ]] || version="$(git describe --tags --always)"
          bin="$(cygpath -u "$CUDA_PATH")/bin"
          mkdir -p dist/cudart
          cp "$bin"/cudart64_12.dll "$bin"/cublas64_12.dll "$bin"/cublasLt64_12.dll dist/cudart/
          (cd dist/cudart && 7z a -tzip -mx=7 "../hypnos-$version-windows-x64-cuda12-runtime.zip" ./*.dll >/dev/null)

      - uses: actions/upload-artifact@v4
        with:
          name: hypnos-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  # The desktop app's installers. Signing turns on with the repository secrets (BUILD-9):
  #   macOS:   APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY
  #            ("Developer ID Application: Name (TEAMID)"); notarization also needs APPLE_ID,
  #            APPLE_PASSWORD (an app-specific password) and APPLE_TEAM_ID.
  #   Windows: WINDOWS_CERTIFICATE (base64 .pfx) and WINDOWS_CERTIFICATE_PASSWORD.
  # Without them macOS gets an ad-hoc signature (Gatekeeper offers "Open Anyway" instead of
  # calling the app damaged) and Windows none (SmartScreen: "More info > Run anyway").
  desktop:
    name: desktop ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 keeps the glibc floor of the .deb and the AppImage low (2.35).
          - { platform: linux-x64, os: ubuntu-22.04, bundles: "deb,appimage" }
          - { platform: windows-x64, os: windows-2022, bundles: "msi,nsis" }
          - { platform: macos-arm64, os: macos-15, bundles: "dmg" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux webview deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 libasound2-dev
      - name: macOS deployment target
        if: runner.os == 'macOS'
        run: echo "MACOSX_DEPLOYMENT_TARGET=14.0" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      # Imports the code-signing certificate into the runner's store and passes its thumbprint
      # to Tauri, which signs the .exe, the .msi and the NSIS installer with signtool.
      - name: Windows signing certificate
        id: wincert
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) { Write-Host "No WINDOWS_CERTIFICATE secret: unsigned build."; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT
      - name: Build the installers
        working-directory: desktop
        shell: bash
        env:
          # Read by the Tauri CLI; empty secrets leave the unsigned / ad-hoc path untouched.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_THUMBPRINT: ${{ steps.wincert.outputs.thumbprint }}
        run: |
          npm ci
          # Tauri treats a set-but-empty variable as configured: drop the ones without a secret.
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] || unset "$v"
          done
          # The tag's version goes into the installers; a manual run keeps tauri.conf.json's.
          config='{}'
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            config=$(jq -c --arg v "${GITHUB_REF_NAME#v}" '.version = $v' <<<"$config")
          fi
          if [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
            config=$(jq -c --arg id "$APPLE_SIGNING_IDENTITY" '.bundle.macOS.signingIdentity = $id' <<<"$config")
          fi
          if [ -n "$WINDOWS_THUMBPRINT" ]; then
            config=$(jq -c --arg t "$WINDOWS_THUMBPRINT" \
              '.bundle.windows.certificateThumbprint = $t | .bundle.windows.digestAlgorithm = "sha256" | .bundle.windows.timestampUrl = "http://timestamp.digicert.com"' <<<"$config")
          fi
          echo "tauri config overrides: $(jq -c 'if .bundle.windows then .bundle.windows.certificateThumbprint = "***" else . end' <<<"$config")"
          npx tauri build --bundles ${{ matrix.bundles }} --config "$config"
      - name: Collect
        shell: bash
        run: |
          version="${GITHUB_REF_NAME}"
          [[ "$GITHUB_REF" == refs/tags/* ]] || version="$(git describe --tags --always)"
          mkdir -p dist
          bundle=desktop/src-tauri/target/release/bundle
          for f in "$bundle"/dmg/*.dmg "$bundle"/msi/*.msi "$bundle"/nsis/*.exe "$bundle"/deb/*.deb "$bundle"/appimage/*.AppImage; do
            [ -f "$f" ] || continue
            ext="${f##*.}"
            [ "$ext" = exe ] && ext="setup.exe"
            cp "$f" "dist/hypnos-desktop-$version-${{ matrix.platform }}.$ext"
          done
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: hypnos-desktop-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  docker:
    name: docker (CUDA, GHCR)
    # Builds and pushes in one step, so the whole job waits for the checks.
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=sha
      # A manual run builds the image without pushing it.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ci, build, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hypnos-*
          merge-multiple: true
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          MAC_SIGNED: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_ID != '' }}
          WIN_SIGNED: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
        run: |
          cd dist
          mac="The macOS app and server are not notarized: open the app once with System Settings > Privacy & Security > Open Anyway, and run xattr -dr com.apple.quarantine . in the server folder."
          win="The Windows installers are not signed: choose More info > Run anyway."
          [ "$MAC_SIGNED" = true ] && mac="The macOS app and server are signed and notarized."
          [ "$WIN_SIGNED" = true ] && win="The Windows installers are signed."
          SIGNING_NOTE="$mac $win"
          files=(*.tar.gz *.zip hypnos-desktop-*)
          sha256sum -- "${files[@]}" > SHA256SUMS
          cat > notes.md <<EOF
          Prebuilt archives for ${GITHUB_REF_NAME}. Unpack, then follow \`README.txt\` inside
          (download models with \`scripts/fetch-models\`, run \`hypnos\`, open http://127.0.0.1:9999).

          | Archive | Needs |
          | :--- | :--- |
          | \`linux-x64-cuda\` | glibc 2.39+, NVIDIA driver 570+, CUDA 12 runtime (cudart, cuBLAS), libgomp1 |
          | \`windows-x64-cuda\` | NVIDIA driver 570+, plus \`windows-x64-cuda12-runtime.zip\` unpacked beside \`hypnos.exe\` (or the CUDA Toolkit 12.x) |
          | \`macos-arm64-metal\` | Apple Silicon, macOS 14+ |

          Desktop app (a chat client with live server stats; it connects to a running Hypnos):
          \`hypnos-desktop-*-macos-arm64.dmg\`, \`-windows-x64.msi\` / \`.setup.exe\`,
          \`-linux-x64.deb\` / \`.AppImage\`. ${SIGNING_NOTE}

          Document conversion on the GPU (docling with \`device = "gpu"\`, off by default) additionally
          needs driver 580+, the CUDA 13 runtime and cuDNN 9 for CUDA 13; see \`README.txt\` in the archive.

          Docker (CUDA): \`docker pull ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME#v}\`

          The binaries link espeak-ng statically, so each archive is distributed under the GNU GPL
          v3 or later (text included); Hypnos's own code is MIT OR Apache-2.0. Corresponding source:
          https://github.com/${GITHUB_REPOSITORY}/tree/${GITHUB_REF_NAME}
          EOF
          # A release made in the GitHub UI (which creates the tag) or left as a draft when its tag
          # moved gets the archives attached and is published; otherwise one is created.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
              -- "${files[@]}" SHA256SUMS
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false \
              --title "Hypnos $GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "Hypnos $GITHUB_REF_NAME" --notes-file notes.md \
              -- "${files[@]}" SHA256SUMS
          fi
