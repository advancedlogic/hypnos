name: ci

on:
  # Runs for a release only: release.yml calls it on a `v*` tag and publishes nothing unless it
  # passes. Pushes and PRs start nothing; run it by hand (Actions > ci > Run workflow) to check a
  # branch before tagging.
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Hosted runners have no CUDA toolkit: the engines are built for the CPU (Linux, Windows) or
  # Metal (macOS). `cuda` is a default feature of hypnos-server and is turned off below.
  CMAKE_GENERATOR: Ninja
  LLAMA_LIB_PROFILE: Release

jobs:
  lint:
    name: fmt + clippy (engine-free crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned, unlike the builds: each Rust release adds lints, and `-D warnings` would turn a
      # new release into a red main with no code change. Bump it deliberately, together with the
      # fixes the new clippy asks for (the version the project is developed with).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Vendor engine sources
        # Cargo loads every workspace member's path dependencies, even for the engine-free crates.
        run: ./backend/scripts/vendor.sh
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target
          key: lint
      - name: rustfmt
        working-directory: backend
        # Scoped to the workspace crates: `--all` would also format the vendored engine bindings.
        run: cargo fmt -p hypnos-core -p hypnos-memory -p hypnos-scheduler -p hypnos-backends -p hypnos-server -- --check
      - name: clippy
        working-directory: backend
        run: cargo clippy -p hypnos-core -p hypnos-memory -p hypnos-scheduler --all-targets -- -D warnings

  build-test:
    name: build + test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-cpu, os: ubuntu-latest, features: "" }
          - { name: windows-cpu, os: windows-latest, features: "" }
          # macos-15 is Apple Silicon; Metal compiles without a GPU attached.
          - { name: macos-metal, os: macos-15, features: "--features hypnos-server/metal" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: lukka/get-cmake@latest
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev libclang-dev
      - name: MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Vendor engine sources (pinned commits + patches)
        shell: bash
        run: ./backend/scripts/vendor.sh
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target
          key: ${{ matrix.name }}
          cache-on-failure: true
      # pwsh, not bash: Git Bash puts its own /usr/bin/link.exe ahead of MSVC's on Windows.
      - name: Build
        working-directory: backend
        shell: pwsh
        run: cargo build --workspace --all-targets --no-default-features ${{ matrix.features }}
      - name: Test
        working-directory: backend
        shell: pwsh
        run: cargo test --workspace --no-default-features ${{ matrix.features }}
      # The release archives and the Docker image build with docling-cuda (ONNX Runtime's CUDA
      # provider, prebuilt by ort): link it here so a broken provider build fails CI, not a release.
      - name: Build the docling-cuda feature
        if: runner.os == 'Linux'
        working-directory: backend
        run: cargo build -p hypnos-server --no-default-features --features docling-cuda

  # The three client SDKs against the mock server (the real router with mock engines).
  sdk:
    name: SDKs (Python, JavaScript, Rust)
    runs-on: ubuntu-latest
    env:
      HYPNOS_MOCK_SERVER: ${{ github.workspace }}/backend/target/debug/examples/mock_server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: lukka/get-cmake@latest
      - name: Linux build deps
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev libclang-dev
      - name: Vendor engine sources
        run: ./backend/scripts/vendor.sh
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            backend -> target
            sdk/rust -> target
          key: sdk
      - name: Build the mock server
        working-directory: backend
        run: cargo build -p hypnos-server --example mock_server --no-default-features
      - uses: astral-sh/setup-uv@v5
      - name: Python SDK
        working-directory: sdk/python
        run: uv sync && uv run pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/javascript/package-lock.json
      - name: JavaScript SDK
        working-directory: sdk/javascript
        run: npm ci && npm test
      - name: Rust SDK
        working-directory: sdk/rust
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  frontend:
    name: frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci && npm run build

  # The Tauri desktop app (desktop/): the binary on each OS, without installers (release.yml
  # makes those). Its web side compiles the JavaScript SDK from sdk/javascript/src.
  desktop:
    name: desktop app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux webview deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: desktop
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install
        working-directory: desktop
        run: npm ci
      - name: fmt + clippy + test
        if: runner.os == 'Linux'
        working-directory: desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      - name: Build
        working-directory: desktop
        run: npx tauri build --no-bundle
