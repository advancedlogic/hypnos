name: ci

on:
  # Every push to main and every pull request (BUILD-14): fmt + clippy, the dependency audit, the
  # SDKs, the frontend, and the build, tests and desktop app on Linux. release.yml calls it on a
  # `v*` tag (publishing nothing unless it passes), and a manual run (Actions > ci > Run workflow)
  # does the same: the build, tests and desktop app on Linux, Windows and macOS.
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Hosted runners have no CUDA toolkit: the engines are built for the CPU (Linux, Windows) or
  # Metal (macOS). `cuda` is a default feature of hypnos-server and is turned off below.
  CMAKE_GENERATOR: Ninja
  LLAMA_LIB_PROFILE: Release

jobs:
  lint:
    name: fmt + clippy (engine-free crates)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Pinned, unlike the builds: each Rust release adds lints, and `-D warnings` would turn a
      # new release into a red main with no code change. Bump it deliberately, together with the
      # fixes the new clippy asks for (the version the project is developed with).
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Vendor engine sources
        # Cargo loads every workspace member's path dependencies, even for the engine-free crates.
        run: ./backend/scripts/vendor.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: backend -> target
          key: lint
      - name: rustfmt
        working-directory: backend
        # Scoped to the workspace crates: `--all` would also format the vendored engine bindings.
        run: cargo fmt -p hypnos-core -p hypnos-memory -p hypnos-scheduler -p hypnos-backends -p hypnos-server -- --check
      - name: clippy
        working-directory: backend
        run: cargo clippy -p hypnos-core -p hypnos-memory -p hypnos-scheduler --all-targets -- -D warnings

  # Dependency audit (BUILD-15): RustSec advisories, licenses and sources for the three Rust
  # workspaces (deny.toml), npm advisories for the three Node projects, and the Python SDK's.
  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Vendor engine sources
        # The backend workspace's path dependencies must exist for `cargo metadata`.
        run: ./backend/scripts/vendor.sh
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: backend/Cargo.toml
          command: check
          arguments: --all-features --config deny.toml
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: desktop/src-tauri/Cargo.toml
          command: check
          arguments: --all-features --config deny.toml
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: sdk/rust/Cargo.toml
          command: check
          arguments: --all-features --config deny.toml
      - name: npm audit (production dependencies, high and critical)
        run: |
          for d in frontend desktop sdk/javascript; do
            echo "== $d"
            (cd "$d" && npm audit --omit=dev --audit-level=high)
          done
      - name: pip-audit (Python SDK)
        run: |
          python3 -m venv /tmp/audit && /tmp/audit/bin/pip install --quiet pip-audit
          /tmp/audit/bin/pip-audit --strict ./sdk/python

  # The parsers that read untrusted input, a minute each under libFuzzer (TEST-6; backend/fuzz,
  # its own workspace, so no engine sources are needed). A crash fails the job and its input is
  # kept as an artifact: add it as a regression test next to the parser.
  fuzz:
    name: fuzz (1 min per parser)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
      - name: cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz
        working-directory: backend
        run: |
          for target in $(cargo +nightly fuzz list); do
            echo "== $target"
            cargo +nightly fuzz run "$target" -- -max_total_time=60
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: fuzz-artifacts
          path: backend/fuzz/artifacts/

  build-test:
    name: build + test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # Pushes and pull requests: Linux. A release or a manual run: Linux, Windows and macOS
      # (macos-15 is Apple Silicon; Metal compiles without a GPU attached).
      matrix:
        include: ${{ fromJSON((github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))) && '[{"name":"linux-cpu","os":"ubuntu-latest","features":""}]' || '[{"name":"linux-cpu","os":"ubuntu-latest","features":""},{"name":"windows-cpu","os":"windows-latest","features":""},{"name":"macos-metal","os":"macos-15","features":"--features hypnos-server/metal"}]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: lukka/get-cmake@f86dd60acae0d132056913e248bdabf0e0580b7a # v4.4.5
      - name: Linux build deps
        timeout-minutes: 10
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev libclang-dev
      - name: MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Vendor engine sources (pinned commits + patches)
        shell: bash
        run: ./backend/scripts/vendor.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: backend -> target
          key: ${{ matrix.name }}
          cache-on-failure: true
      # The engines' CMake builds, kept between runs while their pins, patches and settings are
      # unchanged (BUILD-13; rust-cache leaves the vendored path crates out).
      - name: Engine builds (restore)
        uses: ./.github/actions/engine-cache
        with:
          mode: restore
          profile: debug
          salt: ${{ matrix.name }} ${{ matrix.features }}
      # pwsh, not bash: Git Bash puts its own /usr/bin/link.exe ahead of MSVC's on Windows.
      - name: Build
        working-directory: backend
        shell: pwsh
        run: cargo build --workspace --all-targets --no-default-features ${{ matrix.features }}
      - name: Test
        working-directory: backend
        shell: pwsh
        run: cargo test --workspace --no-default-features ${{ matrix.features }}
      - name: Engine builds (save)
        uses: ./.github/actions/engine-cache
        with:
          mode: save
          profile: debug
      # The release archives and the Docker image build with docling-cuda (ONNX Runtime's CUDA
      # provider, prebuilt by ort): link it here so a broken provider build fails CI, not a release.
      - name: Build the docling-cuda feature
        if: runner.os == 'Linux'
        working-directory: backend
        run: cargo build -p hypnos-server --no-default-features --features docling-cuda

  # The three client SDKs against the mock server (the real router with mock engines).
  sdk:
    name: SDKs (Python, JavaScript, Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HYPNOS_MOCK_SERVER: ${{ github.workspace }}/backend/target/debug/examples/mock_server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: lukka/get-cmake@f86dd60acae0d132056913e248bdabf0e0580b7a # v4.4.5
      - name: Linux build deps
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev libclang-dev
      - name: Vendor engine sources
        run: ./backend/scripts/vendor.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            backend -> target
            sdk/rust -> target
          key: sdk
      - name: Build the mock server
        working-directory: backend
        run: cargo build -p hypnos-server --example mock_server --no-default-features
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Python SDK
        working-directory: sdk/python
        run: uv sync && uv run pytest -q
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/javascript/package-lock.json
      - name: JavaScript SDK
        working-directory: sdk/javascript
        run: npm ci && npm test
      - name: Rust SDK
        working-directory: sdk/rust
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  frontend:
    name: frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci && npm run build

  # The Tauri desktop app (desktop/): the binary on each OS, without installers (release.yml
  # makes those). Its Rust side depends on the Rust SDK in sdk/rust (a path dependency).
  desktop:
    name: desktop app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Pushes and pull requests: Linux; a release or a manual run: all three.
      matrix:
        os: ${{ fromJSON((github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))) && '["ubuntu-22.04"]' || '["ubuntu-22.04","windows-latest","macos-15"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Linux webview deps
        timeout-minutes: 10
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri -> target
          key: desktop
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install
        working-directory: desktop
        run: npm ci
      - name: fmt + clippy + test
        if: runner.os == 'Linux'
        working-directory: desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      - name: Build
        working-directory: desktop
        run: npx tauri build --no-bundle
