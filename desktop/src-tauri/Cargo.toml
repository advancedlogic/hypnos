[package]
name = "hypnos-desktop"
version = "0.2.0"
description = "Hypnos desktop client"
edition = "2021"
license = "MIT OR Apache-2.0"

# Not part of the backend workspace.
[workspace]

[lib]
name = "hypnos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "4"
url = "2"
hypnos-client = { path = "../../sdk/rust" }
tokio = { version = "1", features = ["process", "io-util", "time", "sync"] }
futures = "0.3"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
symphonia = { version = "0.5", features = ["all"] }
tauri-plugin-dialog = "2"
cpal = "0.18"
rodio = { version = "0.23", default-features = false, features = ["playback", "wav"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Proc macros and build scripts are not stripped: on macOS 27 with Xcode 27.2, the release
# profile's default `strip = "debuginfo"` leaves proc-macro dylibs rustc cannot load (E0463
# "can't find crate"). The app binary itself is still stripped.
[profile.release.build-override]
strip = false
