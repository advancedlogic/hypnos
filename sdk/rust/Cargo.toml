[package]
name = "hypnos-client"
version = "0.7.1"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
description = "Async Rust client for the Hypnos multi-modal inference server"
repository = "https://github.com/advancedlogic/hypnos"
documentation = "https://github.com/advancedlogic/hypnos/blob/main/docs/api.md"
readme = "README.md"
keywords = ["hypnos", "llm", "inference", "openai", "client"]
categories = ["api-bindings", "web-programming::http-client"]

# Standalone: not a member of the backend workspace.
[workspace]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
tokio = { version = "1", features = ["time", "sync"] }
bytes = "1"
rand = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
base64 = "0.22"
